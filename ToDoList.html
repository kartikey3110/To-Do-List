
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List Manager</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f1f3ff;
    margin: 0;
    padding: 30px 15px;
    color: #25264b;
}

.container {
    max-width: 650px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 16px;
    box-shadow: 0 5px 20px #00000012;
}

h1 {
    text-align: center;
    color: #5b4bdb;
}

.subtitle {
    text-align: center;
    color: #666;
}

.summary {
    display: flex;
    gap: 10px;
    margin: 25px 0;
}

.card {
    flex: 1;
    padding: 14px 5px;
    background: #f1efff;
    text-align: center;
    border-radius: 10px;
}

.card strong {
    display: block;
    font-size: 24px;
    margin-bottom: 5px;
}

form {
    display: flex;
    gap: 8px;
}

input, button, select {
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #ddd;
    font-size: 14px;
}

#taskInput {
    flex: 1;
    min-width: 0;
}

button {
    background: #5b4bdb;
    color: white;
    border: none;
    cursor: pointer;
}

button:hover {
    opacity: 0.85;
}

.tools {
    display: flex;
    gap: 8px;
    margin: 15px 0;
}

.tools input {
    flex: 1;
    min-width: 0;
}

ul {
    list-style: none;
    padding: 0;
}

li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 13px 5px;
    border-bottom: 1px solid #eee;
    overflow-wrap: anywhere;
}

li span {
    flex: 1;
}

li.done span {
    text-decoration: line-through;
    color: #888;
}

.delete {
    background: #e74c3c;
    padding: 8px 10px;
}

#message {
    text-align: center;
    color: #777;
    padding: 15px;
}

@media (max-width: 480px) {
    .container {
        padding: 16px;
    }

    .summary {
        gap: 5px;
    }

    .tools {
        flex-wrap: wrap;
    }
}
</style>
</head>

<body>
<div class="container">
    <h1>My To-Do List</h1>
    <p class="subtitle">Plan your day, one task at a time!</p>

    <div class="summary">
        <div class="card">
            <strong id="total">0</strong>Total
        </div>
        <div class="card">
            <strong id="pending">0</strong>Pending
        </div>
        <div class="card">
            <strong id="completed">0</strong>Completed
        </div>
    </div>

    <form id="taskForm">
        <input id="taskInput" type="text"
               placeholder="Enter a new task..." required>
        <button type="submit">Add</button>
    </form>

    <div class="tools">
        <input id="searchInput" type="text"
               placeholder="Search tasks...">
        <button id="sortButton" type="button">Sort A–Z</button>
    </div>

    <ul id="taskList"></ul>
    <p id="message">No tasks yet. Add your first task!</p>
</div>

<script>
let tasks = JSON.parse(
    localStorage.getItem("todoTasks") || "[]"
);

const taskForm = document.getElementById("taskForm");
const taskInput = document.getElementById("taskInput");
const searchInput = document.getElementById("searchInput");
const taskList = document.getElementById("taskList");
const message = document.getElementById("message");

function saveTasks() {
    localStorage.setItem("todoTasks", JSON.stringify(tasks));
}

function updateSummary() {
    document.getElementById("total").textContent = tasks.length;
    document.getElementById("completed").textContent =
        tasks.filter(task => task.done).length;
    document.getElementById("pending").textContent =
        tasks.filter(task => !task.done).length;
}

function renderTasks() {
    taskList.innerHTML = "";

    const query = searchInput.value.toLowerCase().trim();
    const visibleTasks = tasks
        .map((task, index) => ({ task, index }))
        .filter(item => item.task.text.toLowerCase().includes(query));

    visibleTasks.forEach(({ task, index }) => {
        const li = document.createElement("li");
        if (task.done) li.classList.add("done");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        checkbox.setAttribute("aria-label", "Mark task completed");

        checkbox.addEventListener("change", () => {
            tasks[index].done = checkbox.checked;
            saveTasks();
            renderTasks();
        });

        const span = document.createElement("span");
        span.textContent = task.text;

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete";
        deleteButton.className = "delete";

        deleteButton.addEventListener("click", () => {
            tasks.splice(index, 1);
            saveTasks();
            renderTasks();
        });

        li.append(checkbox, span, deleteButton);
        taskList.appendChild(li);
    });

    message.textContent = visibleTasks.length
        ? ""
        : (tasks.length ? "No matching tasks found." :
           "No tasks yet. Add your first task!");

    updateSummary();
}

taskForm.addEventListener("submit", event => {
    event.preventDefault();

    const text = taskInput.value.trim();
    if (!text) return;

    tasks.push({ text: text, done: false });
    taskInput.value = "";
    saveTasks();
    renderTasks();
    taskInput.focus();
});

searchInput.addEventListener("input", renderTasks);

document.getElementById("sortButton").addEventListener("click", () => {
    tasks.sort((a, b) => a.text.localeCompare(b.text));
    saveTasks();
    renderTasks();
});

renderTasks();
</script>
</body>
</html>
